name: seurat-env
channels:
  - conda-forge
  - bioconda
dependencies:
  - r-base=4.3.3
  - r-seurat=5.3.0
  - python=3.12
  - r-tidyverse
  - r-devtools
  - r-usethis
  - r-remotes
  - r-biocmanager
  - r-igraph
  - r-nloptr
  - r-lme4
  - r-mice
  - r-weights
  - r-weightedcluster
  - r-aws.s3
  - bioconductor-biomart
  # SuperCell is GitHub-only — not installable via conda.
  # After creating this env, run:
  #   Rscript -e 'remotes::install_github("GfellerLab/SuperCell@f0a041e")'
